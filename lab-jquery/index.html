<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab jQuery - La llama fiestera</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      background: #fff8ea; color: #1b1b2f;
      min-height: 100vh; padding: 2rem 1.5rem; text-align: center;
      transition: background 0.4s, color 0.4s;
    }
    body.noche { background: #1b1b2f; color: #fff8ea; }
    h1 { font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
    .globo {
      display: inline-block; margin: 1.5rem 0 0.5rem; padding: 0.7rem 1.2rem;
      background: #ffc233; color: #1b1b2f; border-radius: 1.2rem; font-weight: 700;
    }
    #llama { position: relative; width: min(300px, 80vw); margin: 0 auto; }
    #llama svg { width: 100%; height: auto; display: block; }
    .botones { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
    button {
      font: inherit; font-weight: 700; padding: 0.8rem 1.4rem; border: 0; border-radius: 999px;
      background: #1f3bd1; color: #fff8ea; cursor: pointer;
    }
    button.alt { background: #ff6b57; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ffc233; outline-offset: 3px; }
    a { display: inline-block; margin-top: 2rem; color: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <h1>La llama fiestera</h1>

  <div class="globo" id="mensaje">¡Hola! Toca un botón.</div>

  <div id="llama">
    <svg viewBox="0 0 300 290" role="img" aria-label="Una llama sonriente con sombrero de fiesta y manta de colores">
      <ellipse cx="150" cy="272" rx="85" ry="9" fill="#000" opacity="0.15"/>
      <!-- patas -->
      <rect x="100" y="205" width="15" height="62" rx="7" fill="#e8d9c0"/>
      <rect x="128" y="205" width="15" height="62" rx="7" fill="#e8d9c0"/>
      <rect x="172" y="205" width="15" height="62" rx="7" fill="#e8d9c0"/>
      <rect x="200" y="205" width="15" height="62" rx="7" fill="#e8d9c0"/>
      <!-- cola, cuerpo y cuello -->
      <circle cx="80" cy="190" r="13" fill="#f3e6cf"/>
      <ellipse cx="155" cy="195" rx="78" ry="46" fill="#f3e6cf"/>
      <rect x="190" y="90" width="38" height="115" rx="19" fill="#f3e6cf"/>
      <!-- manta de colores -->
      <rect x="105" y="158" width="98" height="38" rx="9" fill="#ff6b57"/>
      <rect x="105" y="168" width="98" height="8" fill="#ffc233"/>
      <rect x="105" y="182" width="98" height="6" fill="#1f3bd1"/>
      <!-- cabeza -->
      <ellipse cx="200" cy="52" rx="7" ry="18" transform="rotate(-15 200 52)" fill="#f3e6cf"/>
      <ellipse cx="226" cy="50" rx="7" ry="18" transform="rotate(15 226 50)" fill="#f3e6cf"/>
      <ellipse cx="214" cy="82" rx="34" ry="27" fill="#f3e6cf"/>
      <ellipse cx="240" cy="90" rx="17" ry="13" fill="#e8d9c0"/>
      <circle cx="222" cy="76" r="4.5" fill="#1b1b2f"/>
      <circle cx="223.5" cy="74.5" r="1.4" fill="#fff"/>
      <circle cx="250" cy="87" r="2.5" fill="#1b1b2f"/>
      <path d="M234 98 q8 6 17 0" fill="none" stroke="#1b1b2f" stroke-width="2.5" stroke-linecap="round"/>
      <!-- sombrero de fiesta -->
      <polygon points="200,62 215,18 230,62" fill="#1f3bd1"/>
      <polygon points="207,45 223,45 226,54 204,54" fill="#ffc233"/>
      <circle cx="215" cy="16" r="6" fill="#ff6b57"/>
    </svg>
  </div>

  <div class="botones">
    <button id="saltar">¡Saltar!</button>
    <button id="noche" class="alt">Cambiar a noche</button>
  </div>

  <a href="../">Volver al inicio</a>

  <script>
    var frases = [
      "¡Fiesta en el altiplano!",
      "Esto ya es un 100 en jQuery.",
      "Saltar es mi deporte favorito.",
      "¿Alguien trajo salteñas?",
      "¡Otra vez, otra vez!"
    ];
    var n = 0;

    $("#saltar").on("click", function () {
      $("#llama").stop(true, true)
        .animate({ top: -70 }, 220)
        .animate({ top: 0 }, 220);
      n = (n + 1) % frases.length;
      $("#mensaje").fadeOut(120, function () {
        $(this).text(frases[n]).fadeIn(120);
      });
    });

    $("#noche").on("click", function () {
      $("body").toggleClass("noche");
      $(this).text($("body").hasClass("noche") ? "Cambiar a día" : "Cambiar a noche");
    });
  </script>
</body>
</html>
